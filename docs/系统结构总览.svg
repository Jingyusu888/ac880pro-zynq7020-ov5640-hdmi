<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1360" height="1060" fill="#f7f8fa"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1f2328">系统主线：OV5640 → DDR3L → HDMI2</text>
  <text x="40" y="74" font-size="15" fill="#59636e">原生 1280×720 持续显示，附加单次自动对焦控制 · 主工程 camera_af · 根模块 camera_hdmi_af_top</text>

  <!-- 三段 -->
  <g>
    <rect x="40" y="100" width="400" height="74" rx="10" fill="#eef1ff" stroke="#c7cdf5" stroke-width="1.5"/>
    <text x="60" y="130" font-size="19" font-weight="700" fill="#3b3f8f">获取图像</text>
    <text x="60" y="154" font-size="13.5" fill="#4b5460">配置传感器、识别帧边界、把像素送进用户时钟域</text>

    <rect x="480" y="100" width="400" height="74" rx="10" fill="#e9f7f2" stroke="#b7e3d2" stroke-width="1.5"/>
    <text x="500" y="130" font-size="19" font-weight="700" fill="#1f6b55">缓存完整帧</text>
    <text x="500" y="154" font-size="13.5" fill="#4b5460">打包写入 DDR；三缓冲隔离采集、待显示与显示中的帧</text>

    <rect x="920" y="100" width="400" height="74" rx="10" fill="#fdf1e7" stroke="#f0cfae" stroke-width="1.5"/>
    <text x="940" y="130" font-size="19" font-weight="700" fill="#8a4b18">输出画面</text>
    <text x="940" y="154" font-size="13.5" fill="#4b5460">安全换帧与预取；按固定扫描速度消费像素并编码发送</text>
  </g>

  <!-- 三段之间的箭头 -->
  <g stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="442" y1="137" x2="474" y2="137"/>
    <line x1="882" y1="137" x2="914" y2="137"/>
  </g>

  <!-- 六个步骤卡片 -->
  <g>
    <!-- ① -->
    <rect x="40" y="210" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="58" y="240" font-size="18" font-weight="700" fill="#1f2328">① 摄像头与控制</text>
    <text x="58" y="268" font-size="14" fill="#3f4854">功能：让传感器输出正确格式</text>
    <text x="58" y="292" font-size="14" fill="#3f4854">输入：24 MHz XCLK、SCCB 命令</text>
    <text x="58" y="316" font-size="14" fill="#3f4854">输出：DVP 字节、PCLK、VSYNC、HREF</text>
    <text x="58" y="340" font-size="13" fill="#7852ee">细节：A 初始化 · B SCCB · C/D 自动对焦</text>

    <!-- ② -->
    <rect x="40" y="406" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="58" y="436" font-size="18" font-weight="700" fill="#1f2328">② DVP 采集与跨域</text>
    <text x="58" y="464" font-size="14" fill="#3f4854">功能：两字节拼 RGB565，携带 SOF 跨时钟</text>
    <text x="58" y="488" font-size="14" fill="#3f4854">输入 8 位 DVP → 输出 17 位队列项</text>
    <text x="58" y="512" font-size="14" fill="#3f4854">FIFO 满时丢弃本帧剩余像素，下帧恢复</text>
    <text x="58" y="536" font-size="13" fill="#7852ee">细节：E 采集与异步 FIFO</text>

    <!-- ③ -->
    <rect x="480" y="210" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="498" y="240" font-size="18" font-weight="700" fill="#1f2328">③ 打包与 AXI 写</text>
    <text x="498" y="268" font-size="14" fill="#3f4854">功能：申请缓存，按完整帧组织写入</text>
    <text x="498" y="292" font-size="14" fill="#3f4854">输入 16 位像素 + SOF → 128 位 AXI</text>
    <text x="498" y="316" font-size="14" fill="#3f4854">8 像素/拍，最多 16 拍/突发</text>
    <text x="498" y="340" font-size="13" fill="#7852ee">细节：F 对齐打包 · G 写状态与错误出口</text>

    <!-- ④ -->
    <rect x="480" y="406" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="498" y="436" font-size="18" font-weight="700" fill="#1f2328">④ 三缓冲与 DDR</text>
    <text x="498" y="464" font-size="14" fill="#3f4854">功能：存帧并发布，不覆盖当前显示区</text>
    <text x="498" y="488" font-size="14" fill="#3f4854">三块各 2 MiB，一帧 1 843 200 字节</text>
    <text x="498" y="512" font-size="14" fill="#3f4854">写成功才 READY，显示确认后才切换归属</text>
    <text x="498" y="536" font-size="13" fill="#7852ee">细节：H 帧归属 · L/M 时钟与引脚</text>

    <!-- ⑤ -->
    <rect x="920" y="210" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="938" y="240" font-size="18" font-weight="700" fill="#1f2328">⑤ 读出与像素供数</text>
    <text x="938" y="268" font-size="14" fill="#3f4854">功能：换帧前排完旧事务、清预取</text>
    <text x="938" y="292" font-size="14" fill="#3f4854">128 位队列跨到像素域，拆成 RGB888</text>
    <text x="938" y="316" font-size="14" fill="#3f4854">供数不足时本帧余下输出黑色，下帧重试</text>
    <text x="938" y="340" font-size="13" fill="#7852ee">细节：I AXI 读 · J 扫描与拆包</text>

    <!-- ⑥ -->
    <rect x="920" y="406" width="400" height="168" rx="10" fill="#ffffff" stroke="#d7dbe2"/>
    <text x="938" y="436" font-size="18" font-weight="700" fill="#1f2328">⑥ TMDS 与屏幕</text>
    <text x="938" y="464" font-size="14" fill="#3f4854">功能：按扫描时序输出 DVI 兼容视频</text>
    <text x="938" y="488" font-size="14" fill="#3f4854">三路 8→10 位编码，四路 10:1 串行化</text>
    <text x="938" y="512" font-size="14" fill="#3f4854">OBUFDS → HDMI2 → 显示器</text>
    <text x="938" y="536" font-size="13" fill="#7852ee">细节：K 编码与物理输出</text>
  </g>

  <!-- 段内竖向箭头 -->
  <g stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="240" y1="380" x2="240" y2="400"/>
    <line x1="680" y1="380" x2="680" y2="400"/>
    <line x1="1120" y1="380" x2="1120" y2="400"/>
  </g>

  <!-- 分区索引 -->
  <rect x="40" y="606" width="1280" height="418" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
  <text x="62" y="640" font-size="17" font-weight="700" fill="#1f2328">分区索引 · 15 个功能区（画布内可展开到 181 个节点）</text>
  <g font-size="13.5" fill="#3f4854">
    <text x="62" y="676">A · 图像初始化：模块与状态</text>
    <text x="62" y="704">B · SCCB：唯一主机与读写事务</text>
    <text x="62" y="732">C · 单次自动对焦：模块与命令序列</text>
    <text x="62" y="760">D · AF 事务引擎：状态与超时</text>
    <text x="62" y="788">E · DVP 与异步 FIFO：采集和跨域</text>

    <text x="500" y="676">F · 入口对齐与像素打包</text>
    <text x="500" y="704">G · AXI 写：帧提交与错误出口</text>
    <text x="500" y="732">H · 三缓冲与 DDR：归属和发布</text>
    <text x="500" y="760">I · AXI 读：预取和安全换帧</text>
    <text x="500" y="788">J · 显示侧：扫描、拆包和欠载</text>

    <text x="880" y="676">K · TMDS：编码、串行和差分输出</text>
    <text x="880" y="704">L · 公共时钟、复位及 IP</text>
    <text x="880" y="732">M · 板级引脚与约束</text>
    <text x="880" y="760">N · 版本、参数、证据与复现</text>
    <text x="880" y="788">O · 专项横向关系：写、归属、读</text>
  </g>

  <!-- 时钟域条 -->
  <rect x="62" y="820" width="1240" height="86" rx="10" fill="#f4f6f9" stroke="#e2e6ec"/>
  <text x="82" y="852" font-size="14" font-weight="700" fill="#1f2328">四个时钟域</text>
  <g font-size="13" fill="#3f4854">
    <text x="82" y="880">摄像头 PCLK（约束 20 ns）</text>
    <text x="330" y="880">→ 异步 FIFO →</text>
    <text x="470" y="880">用户域 ui_clk 100 MHz（AXI 128 位）</text>
    <text x="760" y="880">→ 异步 FIFO →</text>
    <text x="900" y="880">像素域 74.21875 MHz</text>
    <text x="1080" y="880">→ 串行 371.09375 MHz</text>
  </g>

  <!-- 图例 -->
  <g font-size="12.5" fill="#6b7480">
    <rect x="62" y="930" width="14" height="14" rx="3" fill="#eef1ff" stroke="#c7cdf5"/>
    <text x="84" y="942">获取图像</text>
    <rect x="160" y="930" width="14" height="14" rx="3" fill="#e9f7f2" stroke="#b7e3d2"/>
    <text x="182" y="942">缓存完整帧</text>
    <rect x="262" y="930" width="14" height="14" rx="3" fill="#fdf1e7" stroke="#f0cfae"/>
    <text x="284" y="942">输出画面</text>
    <text x="380" y="942">本图是笔记内 Obsidian Canvas 的骨架抽取；完整节点、每根连线与逐模块细节见 notes/项目结构与数据流.canvas</text>
  </g>

  <text x="62" y="990" font-size="12.5" fill="#8b929b">生成自 notes/项目结构与数据流.canvas · 顶层 camera_hdmi_af_top · Vivado 2018.3 · XC7Z020-CLG484-2</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
