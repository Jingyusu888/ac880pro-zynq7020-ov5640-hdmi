<text x="55" y="65" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="bold" fill="#182c49">第二阶段编码：控制码与累计不平衡</text>
<line x1="900.0" y1="230" x2="900.0" y2="290" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="900.0" y1="400" x2="390.0" y2="440" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="657.0" y="429.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">是</text>
<line x1="900.0" y1="400" x2="1370.0" y2="440" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1147.0" y="429.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">否</text>
<line x1="1370.0" y1="550" x2="1370.0" y2="620" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1382.0" y="594.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">是</text>
<line x1="1370.0" y1="550" x2="900.0" y2="820" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1147.0" y="694.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">否</text>
<line x1="900.0" y1="930" x2="450.0" y2="1020" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="687.0" y="984.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">是</text>
<line x1="900.0" y1="930" x2="1370.0" y2="1020" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1147.0" y="984.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">否</text>
<line x1="1370.0" y1="1170" x2="450.0" y2="1280" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="922.0" y="1234.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">是</text>
<line x1="1370.0" y1="1170" x2="1370.0" y2="1280" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1382.0" y="1234.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">否</text>
<rect x="570" y="120" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="183.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">像素时钟上升沿，或复位上升沿</text>
<rect x="570" y="290" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="353.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">复位有效？</text>
<rect x="80" y="440" width="620" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="390.0" y="503.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">是：T=1101010100；C=0</text>
<rect x="1060" y="440" width="620" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="503.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">否：DE=0？</text>
<rect x="1060" y="620" width="620" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="665.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">是：按 c1、c0 查表输出控制码</text>
<text x="1370.0" y="701.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">C=0</text>
<rect x="570" y="820" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="883.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">DE=1：C=0 或 B=0？</text>
<rect x="80" y="1020" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="450.0" y="1067.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">是：按 s 选择</text>
<text x="450.0" y="1103.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">s=1：T={0,1,Q}；新C=C+B</text>
<text x="450.0" y="1139.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">s=0：T={1,0,~Q}；新C=C−B</text>
<rect x="1000" y="1020" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="1103.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">否：C 与 B 同号？</text>
<rect x="80" y="1280" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="450.0" y="1327.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">是：反转 Q</text>
<text x="450.0" y="1363.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">T={1,s,~Q}</text>
<text x="450.0" y="1399.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">新C=C−B+2×s</text>
<rect x="1000" y="1280" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="1327.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">否：不反转 Q</text>
<text x="1370.0" y="1363.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">T={0,s,Q}</text>
<text x="1370.0" y="1399.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">新C=C+B−2×(1−s)</text>
<text x="55" y="1520" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#526780">T=tmds_out；C=旧 disparity；B=balance；Q=q_m[7:0]；s=q_m[8]。</text></svg>