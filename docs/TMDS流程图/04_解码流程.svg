<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526780"/></marker></defs>
<text x="55" y="65" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="bold" fill="#182c49">TMDS 解码：恢复控制状态或原始颜色</text>
<line x1="900.0" y1="230" x2="900.0" y2="290" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="900.0" y1="400" x2="430.0" y2="480" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="677.0" y="449.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">是</text>
<line x1="900.0" y1="400" x2="1370.0" y2="480" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1147.0" y="449.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">视频码</text>
<line x1="1370.0" y1="590" x2="1370.0" y2="700" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1370.0" y1="810" x2="450.0" y2="930" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="922.0" y="879.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">XOR</text>
<line x1="1370.0" y1="810" x2="1370.0" y2="930" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1382.0" y="879.0" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#315681">XNOR</text>
<line x1="450.0" y1="1080" x2="900.0" y2="1250" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1370.0" y1="1080" x2="900.0" y2="1250" stroke="#526780" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="570" y="120" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="183.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">已恢复边界正确的 10 位码字 T</text>
<rect x="570" y="290" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="353.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">属于四种固定控制码？</text>
<rect x="80" y="480" width="700" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="430.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">是：查表恢复 c1、c0</text>
<text x="430.0" y="561.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">当前为控制期间，不输出可见颜色</text>
<rect x="1020" y="480" width="700" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="525.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">否且为合法视频码：检查 T[9]</text>
<text x="1370.0" y="561.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">1：Q=~T[7:0]；0：Q=T[7:0]</text>
<rect x="1020" y="700" width="700" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="763.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">检查 T[8]：原来使用哪种运算？</text>
<rect x="80" y="930" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="450.0" y="977.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">T[8]=1：逆向 XOR</text>
<text x="450.0" y="1013.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">D[0]=Q[0]</text>
<text x="450.0" y="1049.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">D[i]=Q[i] XOR Q[i-1]</text>
<rect x="1000" y="930" width="740" height="150" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="1370.0" y="977.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">T[8]=0：逆向 XNOR</text>
<text x="1370.0" y="1013.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">D[0]=Q[0]</text>
<text x="1370.0" y="1049.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">D[i]=Q[i] XNOR Q[i-1]</text>
<rect x="570" y="1250" width="660" height="110" rx="18" fill="white" stroke="#7396bd" stroke-width="2"/>
<text x="900.0" y="1295.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">恢复原始 D[7:0]</text>
<text x="900.0" y="1331.0" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#182c49">解码不需要发送端的累计不平衡状态</text>
<text x="55" y="1450" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#526780">未列出非法码错误处理；蓝色控制通道中 c0=HSYNC、c1=VSYNC。</text></svg>